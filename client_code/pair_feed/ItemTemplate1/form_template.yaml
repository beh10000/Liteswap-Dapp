components:
- components:
  - layout_properties: {grid_position: 'RDVJMZ,MAXBHW'}
    name: label_pair_symbols
    properties:
      align: center
      role: headline
      spacing:
        margin: [null, null, '0', null]
        padding: [null, null, '0', null]
    type: Label
  - layout_properties: {grid_position: 'LBXDWX,PTKXTD'}
    name: label_pair_names
    properties:
      align: center
      foreground: theme:Outline
      role: title
      spacing:
        margin: ['0', null, '0', null]
        padding: ['0', null, '0', null]
    type: Label
  - components:
    - layout_properties: {slot: a}
      name: label_pair_ratio
      properties:
        align: center
        role: title
        spacing:
          margin: ['0', null, null, null]
          padding: ['0', null, null, null]
      type: Label
    - event_bindings: {click: link_switch_click}
      layout_properties: {slot: b}
      name: link_switch
      properties: {icon: 'fa:refresh', icon_align: left, role: body, spacing_above: none, spacing_below: none, text: ' '}
      type: Link
    layout_properties: {grid_position: 'MJYJRG,DJYSTV'}
    name: rich_text_2
    properties:
      align: center
      content: '{a} {b}'
      spacing:
        margin: ['0', null, '0', null]
        padding: ['0', null, '0', null]
    type: RichText
  - components:
    - layout_properties: {slot: a}
      name: label_token_a
      properties:
        spacing:
          margin: ['0', null, '0', null]
          padding: ['0', null, '0', null]
      type: Label
    - layout_properties: {slot: c}
      name: label_token_b
      properties:
        spacing:
          margin: ['0', null, '0', null]
          padding: ['0', null, '0', null]
      type: Label
    - layout_properties: {slot: b}
      name: label_ca_a
      properties:
        spacing:
          margin: ['0', null, '0', null]
          padding: ['0', null, '0', null]
      type: Label
    - layout_properties: {slot: d}
      name: label_ca_b
      properties:
        spacing:
          margin: ['0', null, '0', null]
          padding: ['0', null, '0', null]
      type: Label
    layout_properties: {grid_position: ''}
    name: rich_text_1
    properties:
      align: center
      content: |-
        {a}:  <a src=""> {b}</a><br>
        {c}:  <a src=""> {d}</a>
      format: restricted_html
      role: overline
      spacing:
        margin: ['8', null, null, null]
        padding: ['0', null, null, null]
      visible: false
    type: RichText
  - event_bindings: {click: menu_click}
    layout_properties: {grid_position: 'HVCPVO,MPAVJB'}
    name: button_lp
    properties: {align: full, role: elevated-button, text: Manage Liquidity}
    type: Button
  - event_bindings: {click: menu_click}
    layout_properties: {grid_position: 'ZUBTKW,MTUSWH'}
    name: button_limit_order
    properties: {align: full, role: tonal-button, text: Limit Order}
    type: Button
  - event_bindings: {click: menu_click}
    layout_properties: {grid_position: 'IMAUIC,YSNJEA'}
    name: button_trade
    properties: {align: full, role: filled-button, text: SWAP}
    type: Button
  layout_properties: {grid_position: 'MNIIUK,RNCHPC'}
  name: outlined_card_1
  properties:
    role: [card]
  type: ColumnPanel
container:
  properties: {role: null}
